<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Voice Tripwire</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Deepfake Voice Tripwire</h1>
        <p class="text-gray-500 mb-6 text-sm">Upload a short audio clip (WAV or MP3) to check if the voice is human or AI-generated.</p>

        <form id="uploadForm" class="space-y-4">
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition-colors">
                <input type="file" id="audioFile" accept="audio/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors">
                Analyze Audio
            </button>
        </form>

        <div id="loading" class="hidden mt-6 text-center text-blue-600 font-semibold animate-pulse">
            Running audio through AI detection model...
        </div>

        <div id="resultBox" class="hidden mt-6 p-4 rounded-lg border text-center">
            <h2 id="resultMessage" class="text-xl font-bold"></h2>
            <p id="resultRaw" class="text-xs text-gray-400 mt-3 font-mono"></p>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('audioFile');
            const resultBox = document.getElementById('resultBox');
            const loading = document.getElementById('loading');
            const resultMessage = document.getElementById('resultMessage');
            const resultRaw = document.getElementById('resultRaw');

            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            // Reset UI
            resultBox.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Update UI based on result
                loading.classList.add('hidden');
                resultBox.classList.remove('hidden');

                resultMessage.innerText = data.message;
                resultRaw.innerText = `Raw Model Output: ${JSON.stringify(data.raw_result)}`;

                if (data.is_deepfake) {
                    resultBox.className = "mt-6 p-4 rounded-lg border text-center border-red-500 bg-red-50 text-red-700";
                } else {
                    resultBox.className = "mt-6 p-4 rounded-lg border text-center border-green-500 bg-green-50 text-green-700";
                }

            } catch (error) {
                loading.classList.add('hidden');
                alert('Error analyzing audio. Please try again.');
                console.error(error);
            }
        });
    </script>
</body>
</html>
